name: Deploy portfolio to ConoHa WING

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conoha-portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to yulab-web.com/portfolio
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: conoha-portfolio-production
      url: https://yulab-web.com/portfolio/
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail

          for name in FTP_SERVER FTP_USERNAME FTP_REMOTE_DIR; do
            if [ -z "${!name:-}" ]; then
              echo "::error::GitHub Secret ${name} is not configured."
              exit 1
            fi
          done

          if [ -z "${LFTP_PASSWORD:-}" ]; then
            echo "::error::GitHub Secret FTP_PASSWORD is not configured."
            exit 1
          fi

          if [ "$FTP_SERVER" != "www1161.conoha.ne.jp" ]; then
            echo "::error::FTP_SERVER does not match the approved ConoHa server."
            exit 1
          fi

          if [ "$FTP_USERNAME" != "portfolio2@yulab-web.com" ]; then
            echo "::error::FTP_USERNAME is not the portfolio-only FTP account."
            exit 1
          fi

          if [ "$FTP_REMOTE_DIR" != "./" ]; then
            echo "::error::FTP_REMOTE_DIR must be ./ because this FTP account is restricted to the portfolio directory."
            exit 1
          fi

      - name: Build deployment directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/css deploy/js deploy/assets

          cp index.html privacy.html deploy/
          cp -R css/. deploy/css/
          cp -R js/. deploy/js/
          cp -R assets/. deploy/assets/

          echo "Files prepared for deployment:"
          find deploy -type f -print | sort

      - name: Install FTP client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Verify restricted FTP root
        shell: bash
        run: |
          set -euo pipefail

          lftp <<LFTP_COMMANDS
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:ssl-auth TLS
          set ftp:ssl-protect-data yes
          set ftp:ssl-protect-list yes
          set ssl:verify-certificate yes
          open --user "$FTP_USERNAME" --env-password "ftp://$FTP_SERVER:21"
          cd "$FTP_REMOTE_DIR"
          cls -1a > /tmp/conoha-remote-root.txt
          bye
          LFTP_COMMANDS

          if grep -Eq '^(wp-admin|wp-content|wp-includes|index\.php|\.htaccess)/?$' /tmp/conoha-remote-root.txt; then
            echo "::error::WordPress files are visible at the FTP target. Deployment was stopped before upload."
            exit 1
          fi

          echo "FTP root safety check passed."

      - name: Upload portfolio site
        shell: bash
        run: |
          set -euo pipefail

          lftp <<LFTP_COMMANDS
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:ssl-auth TLS
          set ftp:ssl-protect-data yes
          set ftp:ssl-protect-list yes
          set ssl:verify-certificate yes
          open --user "$FTP_USERNAME" --env-password "ftp://$FTP_SERVER:21"
          cd "$FTP_REMOTE_DIR"
          mirror --reverse --verbose --only-newer --parallel=2 deploy/ ./
          bye
          LFTP_COMMANDS

          echo "Deployment completed: https://yulab-web.com/portfolio/"
